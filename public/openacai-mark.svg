<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">OpenACAI symbol</title>
  <desc id="desc">Symbol-only vector recreation of the public OpenACAI Inc mark.</desc>
  <!-- Hand-vectorized from the symbol portion of the public OpenACAI Inc profile logo. -->
  <defs>
    <linearGradient id="canopy" x1="43" y1="38" x2="218" y2="119" gradientUnits="userSpaceOnUse">
